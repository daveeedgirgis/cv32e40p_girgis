# =============================================================================
# CV32E40P ALU Testbench Configuration - Stage 1
#
# YAML configuration file for controlling all aspects of ALU verification
# This file drives test behavior, coverage collection, and simulation settings
# =============================================================================

# Test Control Settings
test_control:
  num_instructions: 1000              # Number of instructions to execute per test
  test_timeout_cycles: 100000         # Maximum simulation cycles before timeout
  random_seed: 1                      # Random seed (0 for time-based random seed)
  verbosity: "UVM_MEDIUM"             # UVM verbosity: UVM_LOW, UVM_MEDIUM, UVM_HIGH, UVM_FULL
  enable_scoreboard: true             # Enable automatic result checking
  enable_coverage: true               # Enable functional coverage collection
  stop_on_error: false                # Stop simulation on first error

# ALU Operation Control - Enable/disable specific operation types
alu_operations:
  enable_arithmetic: true             # ADD, SUB, ADDU, SUBU operations
  enable_logic: true                  # AND, OR, XOR operations  
  enable_shift: true                  # SLL, SRL, SRA, ROR operations
  enable_comparison: true             # LT, LTU, EQ, NE, GT, GE operations
  enable_bit_manipulation: false     # BSET, BCLR, BEXT operations (PULP extensions)
  enable_division: false              # DIV, REM operations (multicycle, slower)
  enable_min_max: false               # MIN, MAX, MINU, MAXU operations
  enable_abs_clip: false              # ABS, CLIP, CLIPU operations

# Instruction Mix Weights - Control frequency of different instruction types
instruction_weights:
  arithmetic_weight: 30               # Weight for arithmetic instructions (ADD, SUB)
  logic_weight: 25                    # Weight for logic instructions (AND, OR, XOR)
  shift_weight: 20                    # Weight for shift instructions (SLL, SRL, SRA)
  comparison_weight: 15               # Weight for comparison instructions (SLT, SLTU)
  immediate_weight: 10                # Weight for immediate instructions (ADDI, ANDI, etc.)

# Operand Generation Control
operand_control:
  enable_corner_cases: true           # Include corner case values (0, max, min)
  enable_random_operands: true        # Generate random operand values
  operand_min_value: -2147483648      # Minimum operand value (signed 32-bit)
  operand_max_value: 2147483647       # Maximum operand value (signed 32-bit)
  corner_case_percentage: 15          # Percentage of instructions using corner cases
  
  # Corner case values to include
  corner_case_values:
    - 0x00000000                      # Zero
    - 0xFFFFFFFF                      # All ones (-1 signed)
    - 0x7FFFFFFF                      # Maximum positive signed
    - 0x80000000                      # Maximum negative signed
    - 0x00000001                      # One
    - 0x55555555                      # Alternating pattern
    - 0xAAAAAAAA                      # Alternating pattern

# Memory Configuration
memory_config:
  instruction_base_addr: 0x00000080   # Base address for instruction memory
  data_base_addr: 0x00001000          # Base address for data memory
  instruction_memory_size: 8192       # Instruction memory size in bytes
  data_memory_size: 8192              # Data memory size in bytes
  memory_latency_cycles: 1            # Memory response latency in cycles

# Coverage Configuration
coverage_config:
  enable_instruction_coverage: true   # Cover different instruction types
  enable_operand_coverage: true       # Cover operand value ranges
  enable_result_coverage: true        # Cover result value ranges
  enable_operation_coverage: true     # Cover ALU operation types
  enable_cross_coverage: true         # Cross coverage between operations and operands
  
  # Coverage goals (percentage)
  functional_coverage_goal: 95        # Target functional coverage percentage
  code_coverage_goal: 90              # Target code coverage percentage

# Debug and Logging Control
debug_config:
  enable_waveform_dump: true          # Generate VCD/FSDB waveforms
  waveform_format: "fsdb"             # Waveform format: "vcd" or "fsdb"
  enable_transaction_logging: true    # Log all UVM transactions
  enable_alu_signal_logging: true     # Log internal ALU signals
  enable_instruction_trace: true      # Trace instruction execution
  log_file_name: "alu_test.log"       # Main log file name
  
  # Waveform control
  dump_start_time: 0                  # Start waveform dump at time (ns)
  dump_end_time: -1                   # End waveform dump at time (ns, -1 = end of sim)

# Simulation Control
simulation_config:
  simulator: "vcs"                    # Target simulator: "vcs", "questa", "xcelium"
  enable_assertions: true             # Enable SystemVerilog assertions
  enable_checkers: true               # Enable protocol checkers
  optimization_level: "medium"        # Compilation optimization: "none", "medium", "high"
  compile_threads: 4                  # Number of parallel compilation threads

# VCS Specific Settings
vcs_config:
  compile_options:
    - "+define+UVM_REGEX_NO_DPI"      # UVM regex without DPI
    - "-sverilog"                     # Enable SystemVerilog
    - "+v2k"                          # Verilog 2001 support
    - "-timescale=1ns/1ps"            # Time scale
    - "-debug_access+all"             # Full debug access
    - "+vcs+lic+wait"                 # Wait for license
    - "-full64"                       # 64-bit mode
    - "+lint=TFIPC-L"                 # Lint checking
    
  runtime_options:
    - "+UVM_TESTNAME=alu_base_test"   # Default test name
    - "+UVM_VERBOSITY=UVM_MEDIUM"     # Default verbosity
    - "-ucli"                         # Enable UCLI
    - "+vcs+lic+wait"                 # Wait for license
    - "+ntb_random_seed_automatic"    # Automatic seed generation

# Test Definitions - Available test configurations
test_definitions:
  alu_base_test:
    description: "Basic ALU test with mixed operations"
    num_instructions: 500
    operations: ["arithmetic", "logic", "shift", "comparison"]
    corner_case_percentage: 10
    
  alu_arith_test:
    description: "Focused arithmetic operations test"
    num_instructions: 1000
    operations: ["arithmetic"]
    corner_case_percentage: 20
    weights:
      arithmetic_weight: 100
      
  alu_logic_test:
    description: "Focused logic operations test"
    num_instructions: 800
    operations: ["logic"]
    corner_case_percentage: 15
    weights:
      logic_weight: 100
      
  alu_shift_test:
    description: "Focused shift operations test"
    num_instructions: 600
    operations: ["shift"]
    corner_case_percentage: 25
    weights:
      shift_weight: 100
      
  alu_comparison_test:
    description: "Focused comparison operations test"
    num_instructions: 700
    operations: ["comparison"]
    corner_case_percentage: 30
    weights:
      comparison_weight: 100

# File Lists - RTL and verification file organization
file_lists:
  rtl_base_path: "../../rtl"
  verification_base_path: "."
  
  # Core RTL files needed for ALU verification
  rtl_files:
    - "include/cv32e40p_pkg.sv"       # Package definitions
    - "cv32e40p_alu.sv"               # Main ALU module
    - "cv32e40p_alu_div.sv"           # Division unit
    - "cv32e40p_ff_one.sv"            # Find first one
    - "cv32e40p_popcnt.sv"            # Population count
    - "cv32e40p_mult.sv"              # Multiplier
    - "cv32e40p_ex_stage.sv"          # Execute stage
    - "cv32e40p_id_stage.sv"          # Instruction decode stage
    - "cv32e40p_if_stage.sv"          # Instruction fetch stage
    - "cv32e40p_controller.sv"        # Main controller
    - "cv32e40p_decoder.sv"           # Instruction decoder
    - "cv32e40p_compressed_decoder.sv" # Compressed instruction decoder
    - "cv32e40p_register_file_ff.sv"  # Register file
    - "cv32e40p_cs_registers.sv"      # Control/status registers
    - "cv32e40p_load_store_unit.sv"   # Load/store unit
    - "cv32e40p_prefetch_buffer.sv"   # Prefetch buffer
    - "cv32e40p_prefetch_controller.sv" # Prefetch controller
    - "cv32e40p_obi_interface.sv"     # OBI interface
    - "cv32e40p_aligner.sv"           # Instruction aligner
    - "cv32e40p_fifo.sv"              # FIFO
    - "cv32e40p_hwloop_regs.sv"       # Hardware loop registers
    - "cv32e40p_int_controller.sv"    # Interrupt controller
    - "cv32e40p_sleep_unit.sv"        # Sleep unit
    - "cv32e40p_core.sv"              # Core module
    - "cv32e40p_top.sv"               # Top level
  
  # Verification files
  verification_files:
    - "uvm_tb/interfaces/cv32e40p_if.sv"
    - "uvm_tb/interfaces/alu_monitor_if.sv"
    - "uvm_tb/env/alu_pkg.sv"
    - "uvm_tb/tb/alu_tb_top.sv"

# Coverage Exclusions - Operations/scenarios to exclude from coverage
coverage_exclusions:
  exclude_operations:
    - "ALU_BREV"                      # Bit reverse (complex PULP operation)
    - "ALU_SHUF"                      # Shuffle operations
    - "ALU_SHUF2"                     # Shuffle operations
    - "ALU_PCKLO"                     # Pack operations
    - "ALU_PCKHI"                     # Pack operations
    - "ALU_INS"                       # Insert operations
  
  exclude_combinations:
    - "vector_mode_i != VEC_MODE32"   # Exclude vector modes for Stage 1

# Error Injection - For robustness testing (Stage 2/3 feature)
error_injection:
  enable_error_injection: false      # Disable for Stage 1
  error_rate_percentage: 0           # Percentage of transactions with errors
  
# Performance Monitoring
performance_config:
  enable_performance_monitoring: true # Monitor simulation performance
  report_interval_instructions: 1000  # Report progress every N instructions
  enable_bottleneck_analysis: false   # Detailed performance analysis (Stage 3)

---
# Configuration file version and metadata
config_version: "1.0.0"
created_date: "2024-01-15"
description: "Stage 1 ALU verification configuration for CV32E40P"
author: "ChipAgents Verification Team"